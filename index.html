<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodge Rush</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #050611;
    color: white;
    font-family: Arial, sans-serif;
    user-select: none;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 20%, #202b5c, #080914 55%, #02030a);
}

/* BACKGROUND */

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: .7;
    animation: fall linear infinite;
}

@keyframes fall {
    from { transform: translateY(-20px); }
    to { transform: translateY(110vh); }
}

/* UI */

#ui {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    z-index: 10;
    flex-wrap: wrap;
}

.stat {
    padding: 9px 14px;
    background: rgba(0,0,0,.4);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    font-weight: bold;
}

/* PLAYER */

#player {
    width: 48px;
    height: 48px;
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 12px;
    background: linear-gradient(135deg,#00f5ff,#0066ff);
    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,220,255,.7);
    z-index: 5;
}

#player::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    background: white;
    border-radius: 50%;
    left: 17px;
    top: 9px;
    box-shadow: 0 0 12px white;
}

/* SHIELD */

.shield {
    outline: 5px solid rgba(0,255,255,.6);
    box-shadow:
        0 0 20px cyan,
        0 0 60px cyan !important;
}

/* ENEMIES */

.enemy {
    position: absolute;
    z-index: 4;
    border-radius: 9px;
    background: linear-gradient(135deg,#ff174f,#9c00ff);
    box-shadow: 0 0 20px rgba(255,0,100,.8);
}

.fast {
    background: linear-gradient(135deg,#ff7b00,#ff003c);
}

.big {
    background: linear-gradient(135deg,#8b00ff,#ff008c);
}

/* COINS */

.coin {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle,#fff36b,#ffc400,#ff8500);
    box-shadow: 0 0 20px #ffd000;
    z-index: 4;
    animation: spin .7s linear infinite;
}

@keyframes spin {
    from { transform: rotateY(0deg); }
    to { transform: rotateY(360deg); }
}

/* POWER UPS */

.power {
    position: absolute;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    z-index: 4;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    animation: powerFloat .8s ease-in-out infinite alternate;
}

@keyframes powerFloat {
    from { transform: translateY(0); }
    to { transform: translateY(-7px); }
}

.shieldPower {
    background: #00eaff;
    box-shadow: 0 0 25px cyan;
}

.magnetPower {
    background: #ff4fd8;
    box-shadow: 0 0 25px #ff4fd8;
}

.slowPower {
    background: #9d6cff;
    box-shadow: 0 0 25px #9d6cff;
}

/* COMBO */

#combo {
    position: absolute;
    top: 105px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    font-weight: bold;
    color: #ffe600;
    text-shadow: 0 0 15px #ff9d00;
    opacity: 0;
    transition: .2s;
    z-index: 10;
}

/* POPUPS */

.popup {
    position: absolute;
    font-size: 25px;
    font-weight: bold;
    pointer-events: none;
    animation: popup .8s forwards;
    z-index: 20;
}

@keyframes popup {
    0% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    100% {
        opacity: 0;
        transform: translateY(-70px) scale(1.3);
    }
}

/* PARTICLES */

.particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: white;
    pointer-events: none;
    z-index: 30;
    animation: particle .6s forwards;
}

@keyframes particle {
    to {
        opacity: 0;
        transform: translate(var(--x),var(--y)) scale(.2);
    }
}

/* MENUS */

.screen {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(2,3,12,.82);
    backdrop-filter: blur(12px);
    text-align: center;
}

#gameOver {
    display: none;
}

h1 {
    font-size: clamp(50px,9vw,95px);
    background: linear-gradient(90deg,#00f5ff,#a05cff,#ff3c83);
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(0,200,255,.2);
}

h2 {
    font-size: 48px;
    margin-bottom: 15px;
}

.subtitle {
    color: #c7cae0;
    margin: 8px;
    font-size: 18px;
}

button {
    margin-top: 25px;
    padding: 15px 40px;
    border: none;
    border-radius: 14px;
    color: white;
    background: linear-gradient(90deg,#00d9ff,#705cff);
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(0,210,255,.5);
    transition: .2s;
}

button:hover {
    transform: scale(1.08);
}

/* MOBILE */

#mobileControls {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    padding: 0 25px;
    display: flex;
    justify-content: space-between;
    z-index: 40;
}

.control {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: rgba(255,255,255,.1);
    border: 2px solid rgba(255,255,255,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    touch-action: none;
}

@media (min-width:700px) {
    #mobileControls {
        display:none;
    }
}
</style>
</head>

<body>

<div id="game">

<div id="ui">
    <div class="stat">⭐ <span id="score">0</span></div>
    <div class="stat">🪙 <span id="coins">0</span></div>
    <div class="stat">🔥 x<span id="comboNumber">1</span></div>
    <div class="stat">🏆 <span id="best">0</span></div>
    <div class="stat">LVL <span id="level">1</span></div>
</div>

<div id="combo">COMBO x2!</div>

<div id="player"></div>

<div id="mobileControls">
    <div class="control" id="left">◀</div>
    <div class="control" id="right">▶</div>
</div>

<div id="startScreen" class="screen">
    <h1>DODGE RUSH</h1>

    <div class="subtitle">
        ⚡ Dodge enemies • 🪙 Collect coins • 🔥 Build combos
    </div>

    <div class="subtitle">
        A/D or ← → to move
    </div>

    <button onclick="startGame()">PLAY</button>
</div>

<div id="gameOver" class="screen">

    <h2>💥 GAME OVER</h2>

    <div class="subtitle">
        Score: <strong id="finalScore">0</strong>
    </div>

    <div class="subtitle">
        Coins: <strong id="finalCoins">0</strong>
    </div>

    <div class="subtitle">
        Best: <strong id="finalBest">0</strong>
    </div>

    <button onclick="startGame()">PLAY AGAIN</button>

</div>

</div>

<script>

/* =========================
   VARIABLES
========================= */

const game = document.getElementById("game");
const player = document.getElementById("player");

let playerX = innerWidth / 2;

let score = 0;
let coins = 0;
let combo = 1;

let best = Number(localStorage.getItem("dodgeBest") || 0);

let level = 1;

let speed = 250;
let spawnRate = 800;

let enemyTimer = 0;
let coinTimer = 0;
let powerTimer = 0;

let lastTime = 0;

let running = false;

let enemies = [];
let coinObjects = [];
let powers = [];

let shield = false;
let magnet = false;
let slow = false;

let keys = {
    left:false,
    right:false
};

document.getElementById("best").textContent = best;


/* =========================
   STARS
========================= */

for(let i=0;i<80;i++){

    const star = document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    star.style.animationDuration =
        (2+Math.random()*5)+"s";

    star.style.animationDelay =
        (-Math.random()*5)+"s";

    game.appendChild(star);
}


/* =========================
   START
========================= */

function startGame(){

    document.getElementById("startScreen").style.display="none";
    document.getElementById("gameOver").style.display="none";

    enemies.forEach(e=>e.el.remove());
    coinObjects.forEach(c=>c.el.remove());
    powers.forEach(p=>p.el.remove());

    enemies=[];
    coinObjects=[];
    powers=[];

    score=0;
    coins=0;
    combo=1;

    speed=250;
    spawnRate=800;

    level=1;

    shield=false;
    magnet=false;
    slow=false;

    player.classList.remove("shield");

    updateUI();

    playerX=innerWidth/2;

    running=true;

    lastTime=performance.now();

    requestAnimationFrame(loop);
}


/* =========================
   GAME LOOP
========================= */

function loop(time){

    if(!running) return;

    let dt=Math.min(
        (time-lastTime)/1000,
        .05
    );

    lastTime=time;

    movePlayer(dt);

    spawnStuff(dt);

    updateEnemies(dt);

    updateCoins(dt);

    updatePowers(dt);

    score+=dt*12*combo;

    level=Math.floor(score/500)+1;

    speed+=dt*4;

    spawnRate=Math.max(
        250,
        800-level*25
    );

    updateUI();

    requestAnimationFrame(loop);
}


/* =========================
   PLAYER
========================= */

function movePlayer(dt){

    let movement=480;

    if(keys.left)
        playerX-=movement*dt;

    if(keys.right)
        playerX+=movement*dt;

    const half=24;

    playerX=Math.max(
        half,
        Math.min(innerWidth-half,playerX)
    );

    player.style.left=playerX+"px";
}


/* =========================
   SPAWNING
========================= */

function spawnStuff(dt){

    enemyTimer+=dt*1000;
    coinTimer+=dt*1000;
    powerTimer+=dt*1000;

    if(enemyTimer>spawnRate){

        spawnEnemy();

        enemyTimer=0;
    }

    if(coinTimer>1200){

        spawnCoin();

        coinTimer=0;
    }

    if(powerTimer>7000){

        spawnPower();

        powerTimer=0;
    }
}


/* =========================
   ENEMIES
========================= */

function spawnEnemy(){

    const el=document.createElement("div");

    let type=Math.random();

    let size=40;
    let enemySpeed=speed;

    if(type<.18){

        size=65;
        el.className="enemy big";
        enemySpeed*=.7;

    }else if(type<.4){

        size=35;
        el.className="enemy fast";
        enemySpeed*=1.7;

    }else{

        el.className="enemy";
    }

    el.style.width=size+"px";
    el.style.height=size+"px";

    let x=Math.random()*(innerWidth-size);

    el.style.left=x+"px";
    el.style.top="-70px";

    game.appendChild(el);

    enemies.push({
        el,
        x,
        y:-70,
        speed:enemySpeed
    });
}


/* =========================
   COINS
========================= */

function spawnCoin(){

    const el=document.createElement("div");

    el.className="coin";

    let x=Math.random()*(innerWidth-30);

    el.style.left=x+"px";
    el.style.top="-40px";

    game.appendChild(el);

    coinObjects.push({
        el,
        x,
        y:-40,
        speed:speed*.75
    });
}


/* =========================
   POWER UPS
========================= */

function spawnPower(){

    const el=document.createElement("div");

    let types=[
        ["🛡️","shieldPower","shield"],
        ["🧲","magnetPower","magnet"],
        ["🐌","slowPower","slow"]
    ];

    let chosen=
        types[Math.floor(Math.random()*types.length)];

    el.className="power "+chosen[1];
    el.textContent=chosen[0];

    let x=Math.random()*(innerWidth-40);

    el.style.left=x+"px";
    el.style.top="-50px";

    game.appendChild(el);

    powers.push({
        el,
        x,
        y:-50,
        type:chosen[2],
        speed:speed*.6
    });
}


/* =========================
   ENEMY UPDATE
========================= */

function updateEnemies(dt){

    for(let i=enemies.length-1;i>=0;i--){

        let e=enemies[i];

        let multiplier=slow?.45:1;

        e.y+=e.speed*multiplier*dt;

        e.el.style.top=e.y+"px";

        if(hit(player,e.el)){

            if(shield){

                shield=false;

                player.classList.remove("shield");

                explode(
                    e.x+20,
                    e.y+20
                );

                e.el.remove();

                enemies.splice(i,1);

                showPopup(
                    "🛡️ BLOCKED!",
                    e.x,
                    e.y
                );

            }else{

                gameOver();

                return;
            }
        }

        if(e.y>innerHeight+100){

            e.el.remove();

            enemies.splice(i,1);

            combo=1;
        }
    }
}


/* =========================
   COIN UPDATE
========================= */

function updateCoins(dt){

    for(let i=coinObjects.length-1;i>=0;i--){

        let c=coinObjects[i];

        c.y+=c.speed*dt;

        if(magnet){

            let dx=playerX-c.x;

            c.x+=dx*dt*4;
        }

        c.el.style.left=c.x+"px";
        c.el.style.top=c.y+"px";

        if(hit(player,c.el)){

            coins++;

            score+=100*combo;

            combo++;

            if(combo>10)
                combo=10;

            showPopup(
                "🪙 +"+(100*combo),
                c.x,
                c.y
            );

            showCombo();

            explode(c.x,c.y);

            c.el.remove();

            coinObjects.splice(i,1);

            continue;
        }

        if(c.y>innerHeight+50){

            c.el.remove();

            coinObjects.splice(i,1);
        }
    }
}


/* =========================
   POWER UPDATE
========================= */

function updatePowers(dt){

    for(let i=powers.length-1;i>=0;i--){

        let p=powers[i];

        p.y+=p.speed*dt;

        p.el.style.top=p.y+"px";

        if(hit(player,p.el)){

            activatePower(p.type);

            p.el.remove();

            powers.splice(i,1);

            continue;
        }

        if(p.y>innerHeight+60){

            p.el.remove();

            powers.splice(i,1);
        }
    }
}


/* =========================
   POWER ACTIVATION
========================= */

function activatePower(type){

    if(type==="shield"){

        shield=true;

        player.classList.add("shield");

        showPopup(
            "🛡️ SHIELD!",
            playerX,
            innerHeight-100
        );

    }

    if(type==="magnet"){

        magnet=true;

        showPopup(
            "🧲 MAGNET!",
            playerX,
            innerHeight-100
        );

        setTimeout(()=>{
            magnet=false;
        },7000);
    }

    if(type==="slow"){

        slow=true;

        showPopup(
            "🐌 SLOW MOTION!",
            playerX,
            innerHeight-100
        );

        setTimeout(()=>{
            slow=false;
        },5000);
    }
}


/* =========================
   COLLISION
========================= */

function hit(a,b){

    let A=a.getBoundingClientRect();
    let B=b.getBoundingClientRect();

    return !(
        A.right<B.left ||
        A.left>B.right ||
        A.bottom<B.top ||
        A.top>B.bottom
    );
}


/* =========================
   PARTICLES
========================= */

function explode(x,y){

    for(let i=0;i<12;i++){

        let p=document.createElement("div");

        p.className="particle";

        p.style.left=x+"px";
        p.style.top=y+"px";

        let angle=Math.random()*Math.PI*2;
        let distance=30+Math.random()*60;

        p.style.setProperty(
            "--x",
            Math.cos(angle)*distance+"px"
        );

        p.style.setProperty(
            "--y",
            Math.sin(angle)*distance+"px"
        );

        game.appendChild(p);

        setTimeout(()=>{
            p.remove();
        },600);
    }
}


/* =========================
   POPUP
========================= */

function showPopup(text,x,y){

    let p=document.createElement("div");

    p.className="popup";

    p.textContent=text;

    p.style.left=x+"px";
    p.style.top=y+"px";

    game.appendChild(p);

    setTimeout(()=>{
        p.remove();
    },800);
}


function showCombo(){

    if(combo<2) return;

    let c=document.getElementById("combo");

    c.textContent="🔥 COMBO x"+combo+"!";

    c.style.opacity=1;

    clearTimeout(window.comboTimer);

    window.comboTimer=setTimeout(()=>{
        c.style.opacity=0;
    },700);
}


/* =========================
   UI
========================= */

function updateUI(){

    document.getElementById("score")
        .textContent=Math.floor(score);

    document.getElementById("coins")
        .textContent=coins;

    document.getElementById("comboNumber")
        .textContent=combo;

    document.getElementById("level")
        .textContent=level;

    document.getElementById("best")
        .textContent=best;
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;

    let final=Math.floor(score);

    if(final>best){

        best=final;

        localStorage.setItem(
            "dodgeBest",
            best
        );
    }

    document.getElementById("finalScore")
        .textContent=final;

    document.getElementById("finalCoins")
        .textContent=coins;

    document.getElementById("finalBest")
        .textContent=best;

    document.getElementById("gameOver")
        .style.display="flex";
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",e=>{

    if(
        e.key==="ArrowLeft" ||
        e.key.toLowerCase()==="a"
    )
        keys.left=true;

    if(
        e.key==="ArrowRight" ||
        e.key.toLowerCase()==="d"
    )
        keys.right=true;
});


document.addEventListener("keyup",e=>{

    if(
        e.key==="ArrowLeft" ||
        e.key.toLowerCase()==="a"
    )
        keys.left=false;

    if(
        e.key==="ArrowRight" ||
        e.key.toLowerCase()==="d"
    )
        keys.right=false;
});


/* =========================
   MOBILE
========================= */

const leftBtn=
    document.getElementById("left");

const rightBtn=
    document.getElementById("right");

leftBtn.addEventListener(
    "pointerdown",
    ()=>keys.left=true
);

leftBtn.addEventListener(
    "pointerup",
    ()=>keys.left=false
);

leftBtn.addEventListener(
    "pointerleave",
    ()=>keys.left=false
);

rightBtn.addEventListener(
    "pointerdown",
    ()=>keys.right=true
);

rightBtn.addEventListener(
    "pointerup",
    ()=>keys.right=false
);

rightBtn.addEventListener(
    "pointerleave",
    ()=>keys.right=false
);

document.addEventListener(
    "touchmove",
    e=>e.preventDefault(),
    {passive:false}
);

</script>

</body>
</html>

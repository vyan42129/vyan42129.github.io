<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dodge Rush</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    overflow:hidden;
    background:#050611;
    color:white;
    font-family:Arial,sans-serif;
    user-select:none;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
    radial-gradient(circle at 50% 15%,#26356d,#090b18 55%,#02030a);
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:.7;
    animation:fall linear infinite;
}

@keyframes fall{
    from{transform:translateY(-20px)}
    to{transform:translateY(110vh)}
}

/* UI */

#ui{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:center;
    gap:7px;
    flex-wrap:wrap;
    z-index:20;
}

.stat{
    padding:8px 12px;
    background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    font-weight:bold;
    backdrop-filter:blur(8px);
}

/* PLAYER */

#player{
    width:48px;
    height:48px;
    position:absolute;
    bottom:55px;
    left:50%;
    transform:translateX(-50%);
    border-radius:12px;
    background:linear-gradient(135deg,#00f5ff,#0066ff);
    box-shadow:0 0 18px #00eaff,0 0 45px rgba(0,220,255,.7);
    z-index:10;
}

#player::after{
    content:"";
    position:absolute;
    width:14px;
    height:14px;
    left:17px;
    top:9px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 12px white;
}

.shielded{
    outline:5px solid cyan;
    box-shadow:0 0 25px cyan,0 0 70px cyan!important;
}

/* SKINS */

.skin-blue{background:linear-gradient(135deg,#00f5ff,#0066ff)!important}
.skin-purple{background:linear-gradient(135deg,#c400ff,#6200ff)!important}
.skin-green{background:linear-gradient(135deg,#00ff91,#00a84f)!important}
.skin-red{background:linear-gradient(135deg,#ff3030,#8d0000)!important}
.skin-gold{background:linear-gradient(135deg,#fff06a,#ff9d00)!important}
.skin-rainbow{
    background:linear-gradient(135deg,#ff0055,#ffb000,#00ff91,#00aaff,#b000ff)!important;
}

/* ENEMIES */

.enemy{
    position:absolute;
    border-radius:9px;
    background:linear-gradient(135deg,#ff174f,#9c00ff);
    box-shadow:0 0 20px rgba(255,0,100,.8);
    z-index:8;
}

.fast{
    background:linear-gradient(135deg,#ff9100,#ff003c);
}

.big{
    background:linear-gradient(135deg,#8b00ff,#ff008c);
}

/* COINS */

.coin{
    position:absolute;
    width:28px;
    height:28px;
    border-radius:50%;
    background:radial-gradient(circle,#fff36b,#ffc400,#ff8500);
    box-shadow:0 0 20px #ffd000;
    z-index:8;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    from{transform:rotateY(0)}
    to{transform:rotateY(360deg)}
}

/* POWER */

.power{
    position:absolute;
    width:36px;
    height:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    z-index:9;
    animation:float .8s infinite alternate;
}

@keyframes float{
    from{transform:translateY(0)}
    to{transform:translateY(-7px)}
}

.shieldPower{background:#00eaff;box-shadow:0 0 25px cyan}
.magnetPower{background:#ff4fd8;box-shadow:0 0 25px #ff4fd8}
.slowPower{background:#9d6cff;box-shadow:0 0 25px #9d6cff}
.lifePower{background:#ff304f;box-shadow:0 0 25px red}

/* BOSS */

#bossBar{
    display:none;
    position:absolute;
    top:65px;
    left:15%;
    width:70%;
    height:20px;
    border:2px solid white;
    border-radius:20px;
    overflow:hidden;
    z-index:25;
    background:#200008;
}

#bossHealth{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#ff003c,#ff9d00);
    transition:.15s;
}

#bossText{
    position:absolute;
    top:88px;
    left:0;
    right:0;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    z-index:25;
}

/* MENUS */

.screen{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(2,3,12,.88);
    backdrop-filter:blur(13px);
    text-align:center;
}

#gameOver,#shop,#missions,#achievements,#pause{
    display:none;
}

h1{
    font-size:clamp(48px,9vw,90px);
    background:linear-gradient(90deg,#00f5ff,#a05cff,#ff3c83);
    -webkit-background-clip:text;
    color:transparent;
}

h2{
    font-size:42px;
    margin-bottom:15px;
}

.subtitle{
    color:#c7cae0;
    margin:6px;
}

button{
    margin:7px;
    padding:12px 25px;
    border:0;
    border-radius:12px;
    color:white;
    background:linear-gradient(90deg,#00d9ff,#705cff);
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,210,255,.4);
}

button:hover{
    transform:scale(1.06);
}

.menuButtons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    max-width:500px;
}

/* SHOP */

.shopGrid{
    display:grid;
    grid-template-columns:repeat(3,120px);
    gap:12px;
    margin:15px;
}

.shopItem{
    padding:12px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;
}

.skinPreview{
    width:45px;
    height:45px;
    margin:auto auto 8px;
    border-radius:10px;
}

.locked{
    opacity:.5;
}

/* MISSIONS */

.mission{
    width:min(420px,90vw);
    margin:7px;
    padding:12px;
    background:rgba(255,255,255,.08);
    border-radius:12px;
    text-align:left;
}

/* POPUPS */

.popup{
    position:absolute;
    font-size:24px;
    font-weight:bold;
    pointer-events:none;
    animation:popup .8s forwards;
    z-index:200;
}

@keyframes popup{
    0%{opacity:1;transform:translateY(0) scale(1)}
    100%{opacity:0;transform:translateY(-70px) scale(1.3)}
}

.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    z-index:200;
    pointer-events:none;
    animation:particle .6s forwards;
}

@keyframes particle{
    to{
        opacity:0;
        transform:translate(var(--x),var(--y)) scale(.2);
    }
}

/* COMBO */

#combo{
    position:absolute;
    top:105px;
    left:50%;
    transform:translateX(-50%);
    font-size:28px;
    font-weight:bold;
    color:#ffe600;
    text-shadow:0 0 15px orange;
    opacity:0;
    z-index:30;
}

/* MOBILE */

#mobileControls{
    position:absolute;
    bottom:20px;
    left:0;
    right:0;
    padding:0 25px;
    display:flex;
    justify-content:space-between;
    z-index:40;
}

.control{
    width:75px;
    height:75px;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    border:2px solid rgba(255,255,255,.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    touch-action:none;
}

@media(min-width:700px){
    #mobileControls{display:none}
}

@media(max-width:600px){
    .shopGrid{
        grid-template-columns:repeat(2,120px);
    }
}
</style>
</head>

<body>

<div id="game">

<div id="ui">
<div class="stat">⭐ <span id="score">0</span></div>
<div class="stat">🪙 <span id="coins">0</span></div>
<div class="stat">🔥 x<span id="combo">1</span></div>
<div class="stat">❤️ <span id="lives">3</span></div>
<div class="stat">🏆 <span id="best">0</span></div>
<div class="stat">LVL <span id="level">1</span></div>
</div>

<div id="bossBar"><div id="bossHealth"></div></div>
<div id="bossText"></div>

<div id="comboDisplay"></div>

<div id="player"></div>

<div id="mobileControls">
<div class="control" id="left">◀</div>
<div class="control" id="right">▶</div>
</div>

<!-- HOME -->

<div id="startScreen" class="screen">

<h1>DODGE RUSH</h1>

<div class="subtitle">
⚡ Dodge • 🪙 Collect • 🔥 Combo • 👹 Survive Bosses
</div>

<div class="subtitle">
Coins: 🪙 <span id="menuCoins">0</span>
</div>

<div class="menuButtons">
<button onclick="startGame()">🎮 PLAY</button>
<button onclick="openShop()">🛒 SHOP</button>
<button onclick="openMissions()">🎯 MISSIONS</button>
<button onclick="openAchievements()">🏅 ACHIEVEMENTS</button>
</div>

</div>

<!-- GAME OVER -->

<div id="gameOver" class="screen">

<h2>💥 GAME OVER</h2>

<div class="subtitle">Score: <b id="finalScore">0</b></div>
<div class="subtitle">Coins: <b id="finalCoins">0</b></div>
<div class="subtitle">Best: <b id="finalBest">0</b></div>

<button onclick="startGame()">🔄 PLAY AGAIN</button>
<button onclick="goHome()">🏠 HOME</button>

</div>

<!-- SHOP -->

<div id="shop" class="screen">

<h2>🛒 SHOP</h2>

<div class="subtitle">
Your coins: 🪙 <span id="shopCoins">0</span>
</div>

<div class="shopGrid" id="shopGrid"></div>

<button onclick="goHome()">🏠 BACK</button>

</div>

<!-- MISSIONS -->

<div id="missions" class="screen">

<h2>🎯 MISSIONS</h2>

<div id="missionList"></div>

<button onclick="goHome()">🏠 BACK</button>

</div>

<!-- ACHIEVEMENTS -->

<div id="achievements" class="screen">

<h2>🏅 ACHIEVEMENTS</h2>

<div id="achievementList"></div>

<button onclick="goHome()">🏠 BACK</button>

</div>

<!-- PAUSE -->

<div id="pause" class="screen">

<h2>⏸️ PAUSED</h2>

<button onclick="resumeGame()">▶️ RESUME</button>
<button onclick="goHome()">🏠 HOME</button>

</div>

</div>

<script>

/* =====================================
   SAVE DATA
===================================== */

let save=JSON.parse(
localStorage.getItem("dodgeSave")||"null"
);

if(!save){

save={
coins:0,
best:0,
skin:"blue",
owned:["blue"],
missions:{
coins:0,
survive:0,
level:0
},
achievements:[]
};

}

function saveGame(){
localStorage.setItem(
"dodgeSave",
JSON.stringify(save)
);
}


/* =====================================
   SKINS
===================================== */

const skins=[
{
id:"blue",
name:"Ocean",
price:0,
class:"skin-blue"
},
{
id:"purple",
name:"Galaxy",
price:250,
class:"skin-purple"
},
{
id:"green",
name:"Toxic",
price:500,
class:"skin-green"
},
{
id:"red",
name:"Inferno",
price:1000,
class:"skin-red"
},
{
id:"gold",
name:"Gold",
price:2500,
class:"skin-gold"
},
{
id:"rainbow",
name:"Rainbow",
price:5000,
class:"skin-rainbow"
}
];


/* =====================================
   VARIABLES
===================================== */

const game=document.getElementById("game");
const player=document.getElementById("player");

let playerX=innerWidth/2;

let score=0;
let runCoins=0;
let combo=1;
let lives=3;
let level=1;

let speed=250;
let spawnRate=800;

let enemyTimer=0;
let coinTimer=0;
let powerTimer=0;

let lastTime=0;
let running=false;
let paused=false;

let enemies=[];
let coinObjects=[];
let powers=[];

let shield=false;
let magnet=false;
let slow=false;

let boss=null;

let keys={
left:false,
right:false
};


/* =====================================
   STARS
===================================== */

for(let i=0;i<80;i++){

const star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*100+"%";

star.style.animationDuration=
(2+Math.random()*5)+"s";

star.style.animationDelay=
(-Math.random()*5)+"s";

game.appendChild(star);

}


/* =====================================
   AUDIO
===================================== */

const AudioContext=
window.AudioContext||
window.webkitAudioContext;

let audio;

function sound(freq,duration=.08){

try{

if(!audio)
audio=new AudioContext();

let osc=audio.createOscillator();
let gain=audio.createGain();

osc.frequency.value=freq;
osc.type="square";

gain.gain.value=.04;

osc.connect(gain);
gain.connect(audio.destination);

osc.start();

osc.stop(
audio.currentTime+duration
);

}catch(e){}

}


/* =====================================
   UI
===================================== */

function updateUI(){

document.getElementById("score")
.textContent=Math.floor(score);

document.getElementById("coins")
.textContent=runCoins;

document.getElementById("combo")
.textContent=combo;

document.getElementById("lives")
.textContent=lives;

document.getElementById("level")
.textContent=level;

document.getElementById("best")
.textContent=save.best;

document.getElementById("menuCoins")
.textContent=save.coins;

}


/* =====================================
   START GAME
===================================== */

function startGame(){

hideScreens();

enemies.forEach(e=>e.el.remove());
coinObjects.forEach(c=>c.el.remove());
powers.forEach(p=>p.el.remove());

enemies=[];
coinObjects=[];
powers=[];

score=0;
runCoins=0;
combo=1;
lives=3;
level=1;

speed=250;
spawnRate=800;

enemyTimer=0;
coinTimer=0;
powerTimer=0;

shield=false;
magnet=false;
slow=false;

boss=null;

playerX=innerWidth/2;

applySkin();

player.classList.remove("shielded");

document.getElementById("bossBar")
.style.display="none";

document.getElementById("bossText")
.textContent="";

updateUI();

running=true;
paused=false;

lastTime=performance.now();

requestAnimationFrame(loop);

}


/* =====================================
   LOOP
===================================== */

function loop(time){

if(!running||paused)return;

let dt=Math.min(
(time-lastTime)/1000,
.05
);

lastTime=time;

movePlayer(dt);
spawnStuff(dt);
updateEnemies(dt);
updateCoins(dt);
updatePowers(dt);
updateBoss(dt);

score+=dt*12*combo;

level=Math.floor(score/1000)+1;

speed+=dt*5;

spawnRate=Math.max(
260,
800-level*22
);

updateUI();

checkMissions();

requestAnimationFrame(loop);

}


/* =====================================
   PLAYER
===================================== */

function movePlayer(dt){

let movement=480;

if(keys.left)
playerX-=movement*dt;

if(keys.right)
playerX+=movement*dt;

playerX=Math.max(
24,
Math.min(innerWidth-24,playerX)
);

player.style.left=playerX+"px";

}


/* =====================================
   SPAWN
===================================== */

function spawnStuff(dt){

enemyTimer+=dt*1000;
coinTimer+=dt*1000;
powerTimer+=dt*1000;

if(enemyTimer>spawnRate){

spawnEnemy();

enemyTimer=0;

}

if(coinTimer>1100){

spawnCoin();

coinTimer=0;

}

if(powerTimer>6500){

spawnPower();

powerTimer=0;

}

}


/* =====================================
   ENEMIES
===================================== */

function spawnEnemy(){

const el=document.createElement("div");

let type=Math.random();

let size=40;
let enemySpeed=speed;

if(type<.15){

size=65;
el.className="enemy big";
enemySpeed*=.7;

}
else if(type<.4){

size=34;
el.className="enemy fast";
enemySpeed*=1.7;

}
else{

el.className="enemy";

}

el.style.width=size+"px";
el.style.height=size+"px";

let x=Math.random()*(innerWidth-size);

el.style.left=x+"px";
el.style.top="-80px";

game.appendChild(el);

enemies.push({
el,
x,
y:-80,
speed:enemySpeed
});

}


/* =====================================
   COINS
===================================== */

function spawnCoin(){

const el=document.createElement("div");

el.className="coin";

let x=Math.random()*(innerWidth-30);

el.style.left=x+"px";
el.style.top="-40px";

game.appendChild(el);

coinObjects.push({
el,
x,
y:-40,
speed:speed*.75
});

}


/* =====================================
   POWER UPS
===================================== */

function spawnPower(){

const el=document.createElement("div");

let choices=[
["🛡️","shieldPower","shield"],
["🧲","magnetPower","magnet"],
["🐌","slowPower","slow"],
["❤️","lifePower","life"]
];

let choice=
choices[Math.floor(Math.random()*choices.length)];

el.className=
"power "+choice[1];

el.textContent=choice[0];

let x=Math.random()*(innerWidth-40);

el.style.left=x+"px";
el.style.top="-50px";

game.appendChild(el);

powers.push({
el,
x,
y:-50,
type:choice[2],
speed:speed*.6
});

}


/* =====================================
   UPDATE ENEMIES
===================================== */

function updateEnemies(dt){

for(let i=enemies.length-1;i>=0;i--){

let e=enemies[i];

let multiplier=slow?.45:1;

e.y+=e.speed*multiplier*dt;

e.el.style.top=e.y+"px";

if(hit(player,e.el)){

if(shield){

shield=false;

player.classList.remove("shielded");

explode(e.x,e.y);

e.el.remove();

enemies.splice(i,1);

showPopup("🛡️ BLOCKED!",e.x,e.y);

sound(700);

}else{

loseLife();

e.el.remove();

enemies.splice(i,1);

}

}

if(e.y>innerHeight+100){

e.el.remove();

enemies.splice(i,1);

combo=1;

}

}

}


/* =====================================
   LIVES
===================================== */

function loseLife(){

lives--;

combo=1;

sound(100,.2);

showPopup(
"💔 -1 LIFE",
playerX,
innerHeight-100
);

if(lives<=0){

gameOver();

}

}


/* =====================================
   COINS
===================================== */

function updateCoins(dt){

for(let i=coinObjects.length-1;i>=0;i--){

let c=coinObjects[i];

c.y+=c.speed*dt;

if(magnet){

let dx=playerX-c.x;

c.x+=dx*dt*4;

}

c.el.style.left=c.x+"px";
c.el.style.top=c.y+"px";

if(hit(player,c.el)){

let value=100*combo;

score+=value;

runCoins++;

save.coins++;

combo=Math.min(10,combo+1);

showPopup(
"🪙 +"+value,
c.x,
c.y
);

explode(c.x,c.y);

sound(900);

c.el.remove();

coinObjects.splice(i,1);

continue;

}

if(c.y>innerHeight+50){

c.el.remove();

coinObjects.splice(i,1);

}

}

}


/* =====================================
   POWER UPDATE
===================================== */

function updatePowers(dt){

for(let i=powers.length-1;i>=0;i--){

let p=powers[i];

p.y+=p.speed*dt;

p.el.style.top=p.y+"px";

if(hit(player,p.el)){

activatePower(p.type);

p.el.remove();

powers.splice(i,1);

continue;

}

if(p.y>innerHeight+60){

p.el.remove();

powers.splice(i,1);

}

}

}


/* =====================================
   POWER ACTIVATION
===================================== */

function activatePower(type){

sound(1200,.15);

if(type==="shield"){

shield=true;

player.classList.add("shielded");

showPopup(
"🛡️ SHIELD!",
playerX,
innerHeight-100
);

}

if(type==="magnet"){

magnet=true;

showPopup(
"🧲 MAGNET!",
playerX,
innerHeight-100
);

setTimeout(()=>{
magnet=false;
},7000);

}

if(type==="slow"){

slow=true;

showPopup(
"🐌 SLOW MOTION!",
playerX,
innerHeight-100
);

setTimeout(()=>{
slow=false;
},5000);

}

if(type==="life"){

lives=Math.min(5,lives+1);

showPopup(
"❤️ +1 LIFE!",
playerX,
innerHeight-100
);

}

}


/* =====================================
   BOSS
===================================== */

function checkBoss(){

if(level>1 && level%5===0 && !boss){

startBoss();

}

}


function startBoss(){

boss={
health:100,
maxHealth:100,
x:innerWidth/2,
y:-100,
speed:120,
direction:1
};

document.getElementById("bossBar")
.style.display="block";

document.getElementById("bossText")
.textContent="👹 BOSS ROUND!";

showPopup(
"👹 BOSS!",
innerWidth/2,
150
);

sound(100,.4);

}


function updateBoss(dt){

if(level%5===0 && !boss)
startBoss();

if(!boss)return;

boss.y+=boss.speed*dt;

boss.x+=boss.direction*boss.speed*dt;

if(
boss.x>innerWidth-80||
boss.x<80
)
boss.direction*=-1;

if(boss.y>100)
boss.y=100;

let bar=
document.getElementById("bossHealth");

bar.style.width=
(boss.health/boss.maxHealth*100)+"%";

if(hit(player,{
getBoundingClientRect(){
return{
left:boss.x-40,
right:boss.x+40,
top:boss.y-40,
bottom:boss.y+40
};
}
})){

if(shield){

shield=false;

player.classList.remove("shielded");

boss.health-=20;

showPopup(
"💥 BOSS HIT!",
boss.x,
boss.y
);

explode(boss.x,boss.y);

sound(300);

}else{

loseLife();

}

}

if(boss.health<=0){

score+=2000;

save.coins+=100;

showPopup(
"👑 BOSS DEFEATED!",
boss.x,
boss.y
);

explode(boss.x,boss.y);

sound(1500,.3);

boss=null;

document.getElementById("bossBar")
.style.display="none";

document.getElementById("bossText")
.textContent="";

}

}


/* =====================================
   COLLISION
===================================== */

function hit(a,b){

let A=a.getBoundingClientRect();
let B=b.getBoundingClientRect();

return !(
A.right<B.left||
A.left>B.right||
A.bottom<B.top||
A.top>B.bottom
);

}


/* =====================================
   PARTICLES
===================================== */

function explode(x,y){

for(let i=0;i<14;i++){

let p=document.createElement("div");

p.className="particle";

p.style.left=x+"px";
p.style.top=y+"px";

let angle=Math.random()*Math.PI*2;
let distance=30+Math.random()*70;

p.style.setProperty(
"--x",
Math.cos(angle)*distance+"px"
);

p.style.setProperty(
"--y",
Math.sin(angle)*distance+"px"
);

game.appendChild(p);

setTimeout(()=>{
p.remove();
},600);

}

}

   POPUP
===================================== */

function showPopup(text,x,y){

let p=document.createElement("div");

p.className="popup";

p.textContent=text;

p.style.left=x+"px";
p.style.top=y+"px";

game.appendChild(p);

setTimeout(()=>{
p.remove();
},800);

}

/* =====================================
   SHOP
===================================== */

function openShop(){

hideScreens();

document.getElementById("shop")
.style.display="flex";

renderShop();

}

function renderShop(){

let grid=document.getElementById("shopGrid");

grid.innerHTML="";

document.getElementById("shopCoins")
.textContent=save.coins;

skins.forEach(skin=>{

let item=document.createElement("div");

item.className="shopItem";

if(!save.owned.includes(skin.id))
item.classList.add("locked");

let preview=document.createElement("div");

preview.className=
"skinPreview "+skin.class;

let name=document.createElement("div");

name.textContent=skin.name;

let button=document.createElement("button");

if(save.skin===skin.id){

button.textContent="EQUIPPED";

}else if(save.owned.includes(skin.id)){

button.textContent="EQUIP";

}else{

button.textContent="🪙 "+skin.price;

}

button.onclick=()=>{

if(save.owned.includes(skin.id)){

save.skin=skin.id;

saveGame();

renderShop();

}else if(save.coins>=skin.price){

save.coins-=skin.price;

save.owned.push(skin.id);
save.skin=skin.id;

saveGame();

renderShop();

}else{

alert("You need more coins!");

}

};

item.appendChild(preview);
item.appendChild(name);
item.appendChild(button);

grid.appendChild(item);

});

}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dodge Rush</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;background:#050611;color:white;font-family:Arial,sans-serif;user-select:none}
#game{width:100vw;height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 15%,#29376f,#090b18 55%,#02030a)}
.star{position:absolute;width:3px;height:3px;background:white;border-radius:50%;opacity:.7;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(110vh)}}
#ui{position:absolute;top:12px;left:10px;right:10px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap;z-index:30}
.stat{padding:8px 12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);border-radius:10px;font-weight:bold}
#player{width:48px;height:48px;position:absolute;bottom:55px;left:50%;transform:translateX(-50%);border-radius:12px;background:linear-gradient(135deg,#00f5ff,#0066ff);box-shadow:0 0 18px #00eaff,0 0 45px rgba(0,220,255,.7);z-index:15}
#player::after{content:"";position:absolute;width:14px;height:14px;left:17px;top:9px;border-radius:50%;background:white;box-shadow:0 0 12px white}
.shielded{outline:5px solid cyan;box-shadow:0 0 25px cyan,0 0 70px cyan!important}
.skin-purple{background:linear-gradient(135deg,#c400ff,#6200ff)!important}
.skin-green{background:linear-gradient(135deg,#00ff91,#00a84f)!important}
.skin-red{background:linear-gradient(135deg,#ff3030,#8d0000)!important}
.skin-gold{background:linear-gradient(135deg,#fff06a,#ff9d00)!important}
.skin-rainbow{background:linear-gradient(135deg,#ff0055,#ffb000,#00ff91,#00aaff,#b000ff)!important}
.enemy{position:absolute;border-radius:9px;background:linear-gradient(135deg,#ff174f,#9c00ff);box-shadow:0 0 20px rgba(255,0,100,.8);z-index:10}
.fast{background:linear-gradient(135deg,#ff9100,#ff003c)}
.big{background:linear-gradient(135deg,#8b00ff,#ff008c)}
.coin{position:absolute;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fff36b,#ffc400,#ff8500);box-shadow:0 0 20px #ffd000;z-index:11;animation:spin .7s linear infinite}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.power{position:absolute;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:12;animation:float .8s infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.shieldPower{background:#00eaff;box-shadow:0 0 25px cyan}.magnetPower{background:#ff4fd8;box-shadow:0 0 25px #ff4fd8}.slowPower{background:#9d6cff;box-shadow:0 0 25px #9d6cff}.lifePower{background:#ff304f;box-shadow:0 0 25px red}
#boss{display:none;position:absolute;width:110px;height:110px;border-radius:25px;background:radial-gradient(circle at 35% 30%,#ff8a8a,#ff003c 45%,#6900b8);box-shadow:0 0 30px #ff003c,0 0 80px rgba(255,0,80,.8);z-index:18}
#boss::before{content:"👹";position:absolute;font-size:78px;left:14px;top:12px}
#bossBar{display:none;position:absolute;top:65px;left:12%;width:76%;height:22px;border:2px solid white;border-radius:20px;overflow:hidden;z-index:40;background:#250009}
#bossHealth{height:100%;width:100%;background:linear-gradient(90deg,#ff003c,#ff9d00);transition:.15s}
#bossText{position:absolute;top:90px;left:0;right:0;text-align:center;font-size:20px;font-weight:bold;z-index:40}
.bossProjectile{position:absolute;width:18px;height:18px;border-radius:50%;background:#ff004c;box-shadow:0 0 15px #ff004c,0 0 30px #ff004c;z-index:17}
.screen{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(2,3,12,.9);backdrop-filter:blur(13px);text-align:center}
#gameOver,#shop,#missions,#achievements,#pause{display:none}
h1{font-size:clamp(48px,9vw,90px);background:linear-gradient(90deg,#00f5ff,#a05cff,#ff3c83);-webkit-background-clip:text;color:transparent}
h2{font-size:42px;margin-bottom:15px}.subtitle{color:#c7cae0;margin:6px}
button{margin:6px;padding:12px 24px;border:0;border-radius:12px;color:white;background:linear-gradient(90deg,#00d9ff,#705cff);font-size:17px;font-weight:bold;cursor:pointer}
button:hover{transform:scale(1.06)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.menuButtons{display:flex;flex-wrap:wrap;justify-content:center;max-width:550px}
.shopGrid{display:grid;grid-template-columns:repeat(3,120px);gap:12px;margin:15px}
.shopItem{padding:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px}
.skinPreview{width:45px;height:45px;margin:auto auto 8px;border-radius:10px}
.mission{width:min(440px,90vw);margin:6px;padding:12px;background:rgba(255,255,255,.08);border-radius:12px;text-align:left}
.popup{position:absolute;font-size:24px;font-weight:bold;pointer-events:none;animation:popup .8s forwards;z-index:200}
@keyframes popup{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(1.3)}}
.particle{position:absolute;width:6px;height:6px;background:white;border-radius:50%;z-index:200;pointer-events:none;animation:particle .6s forwards}
@keyframes particle{to{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
#mobileControls{position:absolute;bottom:20px;left:0;right:0;padding:0 25px;display:flex;justify-content:space-between;z-index:50}
.control{width:75px;height:75px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:32px;touch-action:none}
@media(min-width:700px){#mobileControls{display:none}}
@media(max-width:600px){.shopGrid{grid-template-columns:repeat(2,120px)}.stat{font-size:13px;padding:6px 9px}}
</style>
</head>
<body>
<div id="game">
<div id="ui">
<div class="stat">⭐ <span id="score">0</span></div>
<div class="stat">🪙 <span id="coins">0</span></div>
<div class="stat">🔥 x<span id="combo">1</span></div>
<div class="stat">❤️ <span id="lives">3</span></div>
<div class="stat">🏆 <span id="best">0</span></div>
<div class="stat">LVL <span id="level">1</span></div>
</div>
<div id="bossBar"><div id="bossHealth"></div></div>
<div id="bossText"></div>
<div id="boss"></div>
<div id="player"></div>
<div id="mobileControls"><div class="control" id="left">◀</div><div class="control" id="right">▶</div></div>

<div id="startScreen" class="screen">
<h1>DODGE RUSH</h1>
<div class="subtitle">⚡ Dodge • 🪙 Collect • 🔥 Combo • 👹 Defeat Bosses</div>
<div class="subtitle">Bank: 🪙 <span id="menuCoins">0</span></div>
<div class="menuButtons">
<button onclick="startGame()">🎮 PLAY</button>
<button onclick="openShop()">🛒 SHOP</button>
<button onclick="openMissions()">🎯 MISSIONS</button>
<button onclick="openAchievements()">🏆 ACHIEVEMENTS</button>
</div>
</div>

<div id="gameOver" class="screen">
<h2>💥 GAME OVER</h2>
<div class="subtitle">Score: <b id="finalScore">0</b></div>
<div class="subtitle">Run Coins: <b id="finalRunCoins">0</b></div>
<div class="subtitle">Bank: 🪙 <b id="finalBank">0</b></div>
<div class="subtitle">Best: <b id="finalBest">0</b></div>
<button onclick="startGame()">🔄 PLAY AGAIN</button>
<button onclick="goHome()">🏠 HOME</button>
</div>

<div id="shop" class="screen">
<h2>🛒 SHOP</h2>
<div class="subtitle">Your bank: 🪙 <span id="shopCoins">0</span></div>
<div class="shopGrid" id="shopGrid"></div>
<button onclick="goHome()">🏠 BACK</button>
</div>

<div id="missions" class="screen">
<h2>🎯 MISSIONS</h2>
<div id="missionList"></div>
<button onclick="goHome()">🏠 BACK</button>
</div>

<div id="achievements" class="screen">
<h2>🏆 ACHIEVEMENTS</h2>
<div class="subtitle">Claim rewards when you complete them!</div>
<div id="achievementList"></div>
<button onclick="goHome()">🏠 BACK</button>
</div>

<div id="pause" class="screen">
<h2>⏸️ PAUSED</h2>
<button onclick="resumeGame()">▶️ RESUME</button>
<button onclick="goHome()">🏠 HOME</button>
</div>
</div>

<script>
let save;
try{save=JSON.parse(localStorage.getItem("dodgeRushSave"))}catch(e){save=null}
if(!save){
save={bankCoins:0,best:0,skin:"blue",owned:["blue"],
missions:{coins:0,score:0,level:0},
achievements:{firstRun:false,coinHunter:false,highScore:false,bossSlayer:false,rich:false},
claimed:{firstRun:false,coinHunter:false,highScore:false,bossSlayer:false,rich:false}};
}
function saveGame(){localStorage.setItem("dodgeRushSave",JSON.stringify(save))}
const skins=[
{id:"blue",name:"Ocean",price:0,class:""},
{id:"purple",name:"Galaxy",price:250,class:"skin-purple"},
{id:"green",name:"Toxic",price:500,class:"skin-green"},
{id:"red",name:"Inferno",price:1000,class:"skin-red"},
{id:"gold",name:"Gold",price:2500,class:"skin-gold"},
{id:"rainbow",name:"Rainbow",price:5000,class:"skin-rainbow"}];
const game=document.getElementById("game"),player=document.getElementById("player");
let playerX=innerWidth/2,score=0,runCoins=0,combo=1,lives=3,level=1,speed=250,spawnRate=800;
let enemyTimer=0,coinTimer=0,powerTimer=0,lastTime=0,running=false,paused=false;
let enemies=[],coinObjects=[],powers=[],projectiles=[],boss=null,bossLevelStarted=0;
let shield=false,magnet=false,slow=false,keys={left:false,right:false};
for(let i=0;i<80;i++){let s=document.createElement("div");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDuration=(2+Math.random()*5)+"s";s.style.animationDelay=(-Math.random()*5)+"s";game.appendChild(s)}
let audio;
function sound(freq,duration=.08){try{const AC=window.AudioContext||window.webkitAudioContext;if(!audio)audio=new AC();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type="square";g.gain.value=.04;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function updateUI(){
document.getElementById("score").textContent=Math.floor(score);
document.getElementById("coins").textContent=runCoins;
document.getElementById("combo").textContent=combo;
document.getElementById("lives").textContent=lives;
document.getElementById("level").textContent=level;
document.getElementById("best").textContent=save.best;
document.getElementById("menuCoins").textContent=save.bankCoins;
}
function startGame(){
hideScreens();clearObjects();score=0;runCoins=0;combo=1;lives=3;level=1;speed=250;spawnRate=800;enemyTimer=0;coinTimer=0;powerTimer=0;shield=false;magnet=false;slow=false;boss=null;bossLevelStarted=0;
document.getElementById("boss").style.display="none";document.getElementById("bossBar").style.display="none";document.getElementById("bossText").textContent="";
playerX=innerWidth/2;applySkin();player.classList.remove("shielded");updateUI();running=true;paused=false;save.achievements.firstRun=true;saveGame();lastTime=performance.now();requestAnimationFrame(loop)
}
function clearObjects(){enemies.forEach(e=>e.el.remove());coinObjects.forEach(c=>c.el.remove());powers.forEach(p=>p.el.remove());projectiles.forEach(p=>p.el.remove());enemies=[];coinObjects=[];powers=[];projectiles=[]}
function loop(time){
if(!running||paused)return;
const dt=Math.min((time-lastTime)/1000,.05);lastTime=time;movePlayer(dt);spawnStuff(dt);updateEnemies(dt);updateCoins(dt);updatePowers(dt);updateBoss(dt);updateProjectiles(dt);
score+=dt*12*combo;level=Math.floor(score/1000)+1;speed+=dt*5;spawnRate=Math.max(260,800-level*22);checkMissions();checkAchievements();updateUI();requestAnimationFrame(loop)
}
function movePlayer(dt){const m=480;if(keys.left)playerX-=m*dt;if(keys.right)playerX+=m*dt;playerX=Math.max(24,Math.min(innerWidth-24,playerX));player.style.left=playerX+"px"}
function spawnStuff(dt){enemyTimer+=dt*1000;coinTimer+=dt*1000;powerTimer+=dt*1000;if(enemyTimer>spawnRate){spawnEnemy();enemyTimer=0}if(coinTimer>1050){spawnCoin();coinTimer=0}if(powerTimer>6500){spawnPower();powerTimer=0}}
function spawnEnemy(){
const el=document.createElement("div"),type=Math.random();let size=40,enemySpeed=speed;
if(type<.15){size=65;el.className="enemy big";enemySpeed*=.7}else if(type<.4){size=34;el.className="enemy fast";enemySpeed*=1.7}else el.className="enemy";
el.style.width=size+"px";el.style.height=size+"px";const x=Math.random()*(innerWidth-size);el.style.left=x+"px";el.style.top="-80px";game.appendChild(el);enemies.push({el,x,y:-80,speed:enemySpeed})
}
function spawnCoin(){
const el=document.createElement("div");el.className="coin";let x=Math.random()*(innerWidth-30);el.style.left=x+"px";el.style.top="-40px";game.appendChild(el);coinObjects.push({el,x,y:-40,speed:speed*.75})
}
function updateCoins(dt){
for(let i=coinObjects.length-1;i>=0;i--){const c=coinObjects[i];c.y+=c.speed*dt;if(magnet)c.x+=(playerX-c.x)*dt*4;c.el.style.left=c.x+"px";c.el.style.top=c.y+"px";
if(hit(player,c.el)){const amount=10,pts=100*combo;runCoins+=amount;save.bankCoins+=amount;score+=pts;combo=Math.min(10,combo+1);save.missions.coins=Math.max(save.missions.coins,save.bankCoins);saveGame();showPopup("🪙 +10 COINS",c.x,c.y);showPopup("⭐ +"+pts,c.x,c.y-25);explode(c.x,c.y);sound(900);c.el.remove();coinObjects.splice(i,1);continue}
if(c.y>innerHeight+50){c.el.remove();coinObjects.splice(i,1)}}}
function spawnPower(){
const el=document.createElement("div"),choices=[["🛡️","shieldPower","shield"],["🧲","magnetPower","magnet"],["🐌","slowPower","slow"],["❤️","lifePower","life"]],chosen=choices[Math.floor(Math.random()*choices.length)];
el.className="power "+chosen[1];el.textContent=chosen[0];const x=Math.random()*(innerWidth-40);el.style.left=x+"px";el.style.top="-50px";game.appendChild(el);powers.push({el,x,y:-50,type:chosen[2],speed:speed*.6})
}
function updatePowers(dt){
for(let i=powers.length-1;i>=0;i--){const p=powers[i];p.y+=p.speed*dt;p.el.style.top=p.y+"px";if(hit(player,p.el)){activatePower(p.type);p.el.remove();powers.splice(i,1);continue}if(p.y>innerHeight+60){p.el.remove();powers.splice(i,1)}}
}
function activatePower(type){
sound(1200,.15);
if(type==="shield"){shield=true;player.classList.add("shielded");showPopup("🛡️ SHIELD!",playerX,innerHeight-100)}
if(type==="magnet"){magnet=true;showPopup("🧲 MAGNET!",playerX,innerHeight-100);setTimeout(()=>magnet=false,7000)}
if(type==="slow"){slow=true;showPopup("🐌 SLOW MOTION!",playerX,innerHeight-100);setTimeout(()=>slow=false,5000)}
if(type==="life"){lives=Math.min(5,lives+1);showPopup("❤️ +1 LIFE!",playerX,innerHeight-100)}
}
function updateEnemies(dt){
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.y+=e.speed*(slow?.45:1)*dt;e.el.style.top=e.y+"px";
if(hit(player,e.el)){if(shield){shield=false;player.classList.remove("shielded");explode(e.x,e.y);showPopup("🛡️ BLOCKED!",e.x,e.y);sound(700);e.el.remove();enemies.splice(i,1)}else{loseLife();e.el.remove();enemies.splice(i,1)}}
if(e.y>innerHeight+100){e.el.remove();enemies.splice(i,1);combo=1}}}
function loseLife(){lives--;combo=1;sound(100,.2);showPopup("💔 -1 LIFE",playerX,innerHeight-100);if(lives<=0)gameOver()}
function startBoss(){
if(boss)return;
boss={health:100,maxHealth:100,x:innerWidth/2,y:130,direction:1,speed:180,shotTimer:0};bossLevelStarted=level;
const b=document.getElementById("boss");b.style.display="block";b.style.left=(boss.x-55)+"px";b.style.top=boss.y+"px";
document.getElementById("bossBar").style.display="block";document.getElementById("bossText").textContent="👹 BOSS ROUND!";showPopup("👹 BOSS!",innerWidth/2,170);sound(100,.4)
}
function updateBoss(dt){
if(level>=5&&level%5===0&&!boss&&bossLevelStarted!==level)startBoss();
if(!boss)return;
const b=document.getElementById("boss");boss.x+=boss.direction*boss.speed*dt;if(boss.x>innerWidth-70)boss.direction=-1;if(boss.x<70)boss.direction=1;
b.style.left=(boss.x-55)+"px";b.style.top=boss.y+"px";boss.shotTimer+=dt*1000;if(boss.shotTimer>1300){shootBoss();boss.shotTimer=0}
document.getElementById("bossHealth").style.width=(boss.health/boss.maxHealth*100)+"%";
const box={getBoundingClientRect(){return{left:boss.x-55,right:boss.x+55,top:boss.y,bottom:boss.y+110}}};
if(hit(player,box)){if(shield){shield=false;player.classList.remove("shielded");boss.health-=20;showPopup("💥 BOSS HIT!",boss.x,boss.y);explode(boss.x,boss.y);sound(300)}else loseLife()}
if(boss&&boss.health<=0)defeatBoss()
}
function shootBoss(){
if(!boss)return;const el=document.createElement("div");el.className="bossProjectile";el.style.left=(boss.x-9)+"px";el.style.top=(boss.y+100)+"px";game.appendChild(el);projectiles.push({el,x:boss.x,y:boss.y+100,speed:300})
}
function updateProjectiles(dt){
for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.y+=p.speed*(slow?.45:1)*dt;p.el.style.top=p.y+"px";
if(hit(player,p.el)){if(shield){shield=false;player.classList.remove("shielded");showPopup("🛡️ BLOCKED!",p.x,p.y)}else loseLife();p.el.remove();projectiles.splice(i,1);continue}
if(p.y>innerHeight+30){p.el.remove();projectiles.splice(i,1)}}}
}
function defeatBoss(){
score+=5000;const reward=250;runCoins+=reward;save.bankCoins+=reward;save.achievements.bossSlayer=true;saveGame();showPopup("👑 BOSS DEFEATED!",boss.x,boss.y);showPopup("🪙 +250 COINS!",boss.x,boss.y+40);explode(boss.x,boss.y);sound(1500,.4);boss=null;
document.getElementById("boss").style.display="none";document.getElementById("bossBar").style.display="none";document.getElementById("bossText").textContent=""
}
function hit(a,b){const A=a.getBoundingClientRect(),B=b.getBoundingClientRect();return !(A.right<B.left||A.left>B.right||A.bottom<B.top||A.top>B.bottom)}
function explode(x,y){for(let i=0;i<18;i++){const p=document.createElement("div");p.className="particle";p.style.left=x+"px";p.style.top=y+"px";const angle=Math.random()*Math.PI*2,d=30+Math.random()*80;p.style.setProperty("--x",Math.cos(angle)*d+"px");p.style.setProperty("--y",Math.sin(angle)*d+"px");game.appendChild(p);setTimeout(()=>p.remove(),600)}}
function showPopup(text,x,y){const p=document.createElement("div");p.className="popup";p.textContent=text;p.style.left=x+"px";p.style.top=y+"px";game.appendChild(p);setTimeout(()=>p.remove(),800)}
function gameOver(){running=false;if(Math.floor(score)>save.best)save.best=Math.floor(score);saveGame();document.getElementById("finalScore").textContent=Math.floor(score);document.getElementById("finalRunCoins").textContent=runCoins;document.getElementById("finalBank").textContent=save.bankCoins;document.getElementById("finalBest").textContent=save.best;document.getElementById("gameOver").style.display="flex";updateUI()}
function openShop(){hideScreens();document.getElementById("shop").style.display="flex";renderShop()}
function renderShop(){
const grid=document.getElementById("shopGrid");grid.innerHTML="";document.getElementById("shopCoins").textContent=save.bankCoins;
skins.forEach(skin=>{const item=document.createElement("div"),preview=document.createElement("div"),name=document.createElement("div"),button=document.createElement("button");
item.className="shopItem";preview.className="skinPreview "+skin.class;name.textContent=skin.name;
if(save.skin===skin.id){button.textContent="EQUIPPED";button.disabled=true}
else if(save.owned.includes(skin.id)){button.textContent="EQUIP";button.onclick=()=>{save.skin=skin.id;saveGame();renderShop()}}
else{button.textContent="🪙 "+skin.price;button.onclick=()=>{if(save.bankCoins>=skin.price){save.bankCoins-=skin.price;save.owned.push(skin.id);save.skin=skin.id;saveGame();renderShop()}else alert("You need "+(skin.price-save.bankCoins)+" more coins!")}}
item.appendChild(preview);item.appendChild(name);item.appendChild(button);grid.appendChild(item)})
}
function applySkin(){const s=skins.find(x=>x.id===save.skin);player.className="";if(s&&s.class)player.classList.add(s.class);if(shield)player.classList.add("shielded")}
const missionData=[
{id:"coins",name:"🪙 Coin Collector",target:100,reward:500},
{id:"score",name:"⭐ Score Master",target:10000,reward:1000},
{id:"level",name:"📈 Level 10",target:10,reward:1500}];
function openMissions(){hideScreens();document.getElementById("missions").style.display="flex";renderMissions()}
function renderMissions(){const list=document.getElementById("missionList");list.innerHTML="";missionData.forEach(m=>{const p=save.missions[m.id]||0,div=document.createElement("div");div.className="mission";div.innerHTML=`<b>${m.name}</b><br>Progress: ${Math.min(p,m.target)}/${m.target}<br>Reward: 🪙 ${m.reward}${p>=m.target?"<br>✅ COMPLETED":""}`;list.appendChild(div)})}
function checkMissions(){save.missions.coins=Math.max(save.missions.coins,save.bankCoins);save.missions.score=Math.max(save.missions.score,Math.floor(score));save.missions.level=Math.max(save.missions.level,level);saveGame()}
const achievementData=[
{id:"firstRun",name:"🎮 First Run",description:"Play your first game",reward:100},
{id:"coinHunter",name:"🪙 Coin Hunter",description:"Collect 100 coins",reward:500},
{id:"highScore",name:"⭐ High Roller",description:"Reach 10,000 score",reward:1000},
{id:"bossSlayer",name:"👑 Boss Slayer",description:"Defeat a boss",reward:750},
{id:"rich",name:"💰 Rich",description:"Have 5,000 bank coins",reward:2000}];
function checkAchievements(){if(save.bankCoins>=100)save.achievements.coinHunter=true;if(save.best>=10000||score>=10000)save.achievements.highScore=true;if(save.bankCoins>=5000)save.achievements.rich=true;saveGame()}
function openAchievements(){hideScreens();document.getElementById("achievements").style.display="flex";renderAchievements()}
function renderAchievements(){
const list=document.getElementById("achievementList");list.innerHTML="";
achievementData.forEach(a=>{const unlocked=save.achievements[a.id],claimed=save.claimed[a.id],div=document.createElement("div");div.className="mission";let html=`<b>${unlocked?"🏆":"🔒"} ${a.name}</b><br>${a.description}<br>Reward: 🪙 ${a.reward}`;
if(unlocked&&!claimed)html+=`<br><button onclick="claimAchievement('${a.id}')">🎁 CLAIM</button>`;
else if(claimed)html+="<br>✅ CLAIMED";else html+="<br>🔒 Not completed";
div.innerHTML=html;list.appendChild(div)})
}
function claimAchievement(id){const a=achievementData.find(x=>x.id===id);if(!a||!save.achievements[id]||save.claimed[id])return;save.bankCoins+=a.reward;save.claimed[id]=true;saveGame();sound(1300,.2);renderAchievements();updateUI()}
function goHome(){running=false;paused=false;clearObjects();boss=null;document.getElementById("boss").style.display="none";document.getElementById("bossBar").style.display="none";document.getElementById("bossText").textContent="";hideScreens();document.getElementById("startScreen").style.display="flex";updateUI()}
function hideScreens(){document.querySelectorAll(".screen").forEach(s=>s.style.display="none")}
function pauseGame(){if(!running)return;paused=true;document.getElementById("pause").style.display="flex"}
function resumeGame(){paused=false;document.getElementById("pause").style.display="none";lastTime=performance.now();requestAnimationFrame(loop)}
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=true;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=true;if(e.key==="Escape"){if(paused)resumeGame();else pauseGame()}});
document.addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=false;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=false});
const leftBtn=document.getElementById("left"),rightBtn=document.getElementById("right");
leftBtn.addEventListener("pointerdown",()=>keys.left=true);leftBtn.addEventListener("pointerup",()=>keys.left=false);leftBtn.addEventListener("pointerleave",()=>keys.left=false);
rightBtn.addEventListener("pointerdown",()=>keys.right=true);rightBtn.addEventListener("pointerup",()=>keys.right=false);rightBtn.addEventListener("pointerleave",()=>keys.right=false);
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
applySkin();updateUI();
</script>
</body>
